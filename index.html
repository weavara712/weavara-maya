<head>

<title>Weavara | The Art of Weaving Stories</title>
<meta name="description" content="Weavara is a woman-led saree brand rooted in Varanasi. Banarasi silk, wedding and festive sarees, exclusive and customised designs. Order on WhatsApp.">
<meta name="theme-color" content="#0F2747">
<meta property="og:title" content="Weavara | The Art of Weaving Stories">
<meta property="og:description" content="Threads of Tradition. Stories of You. Sarees from Varanasi, ordered on WhatsApp.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap">
<style>
:root{
  --navy:#0F2747; --gold:#CDA45F; --ivory:#F9F5EA; --beige:#E8D7BE; --maroon:#6B1F2B; --sage:#7A8F63;
  --serif:'Cormorant Garamond','Noto Serif Devanagari',Georgia,serif;
  --sans:'Jost','Noto Sans Devanagari',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--navy);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
.dark :focus-visible{outline-color:var(--gold)}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}
.sec{padding:clamp(56px,8vw,96px) 0}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--maroon)}
.dark .eyebrow{color:var(--gold)}
.h2{font-size:clamp(32px,4.4vw,54px)}
.lead{font-size:18px;max-width:720px}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--navy);background:var(--navy);color:var(--ivory);transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:var(--ivory);color:var(--navy);border-color:var(--gold)}
.btn.ghost:hover{background:var(--beige)}
.btn.light{background:var(--ivory);color:var(--navy);border-color:var(--ivory)}
.btn.light:hover{background:var(--gold);border-color:var(--gold)}
.btn.line{background:transparent;color:var(--ivory);border-color:var(--gold)}
.btn.line:hover{background:var(--gold);color:var(--navy)}
.btn.maroon{background:var(--maroon);border-color:var(--maroon)}
.btn.maroon:hover{background:var(--navy);border-color:var(--navy);color:var(--ivory)}
.btn.sm{min-height:40px;padding:0 18px;font-size:13px}
.btn.block{width:100%}
.ann{background:var(--navy);color:var(--ivory);text-align:center;padding:9px 16px;font-size:14px;letter-spacing:.03em}
/* header */
#hdr{position:sticky;top:0;z-index:40;background:var(--ivory);border-bottom:1px solid var(--beige)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;flex:none;background:#F7F7F7}
.logo img{width:100%;height:100%;object-fit:cover}
.bname{font-family:var(--serif);font-size:30px;letter-spacing:.26em;font-weight:600;line-height:1}
.tools{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;border:1px solid var(--gold);background:var(--ivory);height:42px;width:min(280px,32vw)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 12px;font:inherit;font-size:15px;color:var(--navy)}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--maroon);outline-offset:2px}
.search button{width:42px;height:100%;border:0;background:transparent;color:var(--navy);display:flex;align-items:center;justify-content:center}
.lang{display:inline-flex;border:1px solid var(--gold)}
.lang button{border:0;background:transparent;color:var(--navy);height:40px;min-width:44px;padding:0 10px;font-size:14px;font-weight:500}
.lang button.on{background:var(--navy);color:var(--ivory)}
.burger{display:none;width:44px;height:44px;border:0;background:transparent;color:var(--navy);align-items:center;justify-content:center}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 30px;border-top:1px solid var(--beige)}
.nav a{display:inline-block;padding:12px 2px;font-size:13.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{border-bottom-color:var(--gold)}
.drawer{display:none;border-top:1px solid var(--beige);background:var(--ivory)}
.drawer.open{display:block}
.drawer a{display:block;padding:14px 20px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--beige)}
.msearch{display:none;padding:10px 20px;border-top:1px solid var(--beige)}
.msearch .search{width:100%;display:flex}
@media(max-width:980px){
  .nav{display:none}
  .burger{display:inline-flex}
  .tools .search{display:none}
  .msearch{display:block}
  .bname{font-size:24px;letter-spacing:.2em}
  .tools .book{display:none}
}
@media(max-width:420px){.bname{font-size:20px;letter-spacing:.14em}.logo{width:46px;height:46px}}
/* hero: image only, edge to edge, same size for all banners */
.hero{position:relative;overflow:hidden;background:var(--navy)}
.slide{display:none}
.slide.on{display:block}
.slide a,.slide picture{display:block}
.slide img{display:block;width:100%;height:auto;aspect-ratio:1920/700;object-fit:cover}
.hero .cb{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:44px;border:0;background:rgba(15,39,71,.55);color:var(--ivory);display:flex;align-items:center;justify-content:center;border-radius:10px}
.hero .cb:hover{background:var(--navy)}
.hero .cb.prev{left:16px}
.hero .cb.next{right:16px}
.hero .dots{position:absolute;left:0;right:0;bottom:4px;z-index:3;display:flex;justify-content:center}
.hero .dot{width:44px;height:36px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.hero .dot i{display:block;width:28px;height:3px;background:rgba(249,245,234,.55);box-shadow:0 0 0 1px rgba(15,39,71,.25)}
.hero .dot.on i{background:var(--ivory)}
.hero :focus-visible{outline-color:var(--gold)}
@media(max-width:820px){.slide img{aspect-ratio:1/1}.hero .cb{width:38px;height:38px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* grids */
.grid{display:grid;gap:24px}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tile{display:flex;flex-direction:column;gap:12px;min-width:0}
.tile .im{aspect-ratio:4/5;overflow:hidden;background:var(--beige)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tile:hover img{transform:scale(1.04)}
.tile h3{font-size:26px}
.tile .go{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--maroon)}
.pcard{display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard .im{display:block;aspect-ratio:3/4;overflow:hidden;background:var(--beige);border:1px solid var(--beige)}
.pcard .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .im img{transform:scale(1.04)}
.pcard h3{font-size:22px;line-height:1.2}
.pcard .col{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--maroon);font-weight:500}
.price{font-weight:600;font-size:18px}
.bg-beige{background:var(--beige)}
.dark{background:var(--navy);color:var(--ivory)}
.maroonbg{background:var(--maroon);color:var(--ivory)}
.split{display:flex;flex-wrap:wrap;align-items:center;gap:56px}
.split>*{flex:1 1 420px;min-width:0}
.pic3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pic3 img{width:100%;height:100%;object-fit:cover}
.pic3 .tall{grid-row:span 2}
.quote{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.3;color:var(--maroon)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.gal figure{margin:0;position:relative;aspect-ratio:1/1;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;left:0;bottom:0;background:var(--ivory);color:var(--navy);padding:5px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.card{background:var(--ivory);border:1px solid var(--beige);padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.top{border-top:3px solid var(--gold)}
.card h3{font-size:28px}
.bar3{display:block;width:36px;height:3px;background:var(--sage)}
.faq{border-top:1px solid var(--gold)}
.faq details{border-bottom:1px solid var(--gold)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;cursor:pointer;font-family:var(--serif);font-size:24px;line-height:1.25}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--sans);font-size:26px;color:var(--maroon);flex:none}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 0 22px;max-width:640px}
.crumbs{font-size:14px;display:flex;flex-wrap:wrap;gap:8px;color:var(--maroon)}
.crumbs a:hover{text-decoration:underline}
.toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
select.sel{height:44px;border:1px solid var(--gold);background:var(--ivory);color:var(--navy);padding:0 12px;font:inherit;font-size:15px}
.pd{display:flex;flex-wrap:wrap;gap:48px}
.pd>*{flex:1 1 380px;min-width:0}
.pd .big{aspect-ratio:3/4;border:1px solid var(--beige);overflow:hidden;max-width:560px}
.pd .big img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--beige);padding:4px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
/* footer */
footer .cols{display:flex;flex-wrap:wrap;gap:44px;justify-content:space-between}
footer .col{flex:1 1 170px;display:flex;flex-direction:column;gap:10px;min-width:0}
footer .col.big{flex:2 1 320px;max-width:440px}
footer a:hover{color:var(--gold)}
footer .legal{border-top:1px solid var(--gold);padding-top:22px;margin-top:44px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:14px}
/* whatsapp float */
.wa{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,39,71,.35)}
.wa:hover{transform:scale(1.06)}
.wa svg{width:32px;height:32px}
.wa .tip{position:absolute;right:70px;background:var(--navy);color:var(--ivory);font-size:13px;padding:6px 12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.wa:hover .tip,.wa:focus-visible .tip{opacity:1}
@media(max-width:600px){.wa .tip{display:none}}
/* modal */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(15,39,71,.65);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mdl{background:var(--ivory);width:100%;max-width:520px;max-height:100%;overflow:auto;padding:28px;position:relative;border-top:4px solid var(--gold)}
.mdl h2{font-size:34px;margin-bottom:6px}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:transparent;color:var(--navy);font-size:28px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.field input,.field textarea{width:100%;border:1px solid var(--gold);background:#fff;color:var(--navy);padding:12px;font:inherit;font-size:16px;min-height:48px}
.field textarea{min-height:84px;resize:vertical}
.field .err{color:var(--maroon);font-size:14px;min-height:0}
.field.bad input,.field.bad textarea{border-color:var(--maroon);border-width:2px}
.sel-p{display:flex;gap:14px;align-items:center;border:1px solid var(--beige);padding:10px;margin-top:14px;background:var(--beige)}
.sel-p img{width:56px;height:74px;object-fit:cover}
.note{font-size:14px}
.empty{padding:60px 0;text-align:center}
html[lang="hi"] body *{letter-spacing:normal!important}
html[lang="hi"] .bname{letter-spacing:.26em!important}
/* soft rounded corners */
.btn,.search,.lang,select.sel{border-radius:10px;overflow:hidden}
.lang button,.search button{border-radius:0}
.tile .im,.pcard .im,.pd .big,.gal figure,.card,.sel-p{border-radius:14px;overflow:hidden}
.chip{border-radius:999px}
.pic3 img{border-radius:14px}
.maroonbg .split>div:last-child{border-radius:14px;overflow:hidden}
.ctrl .cb{border-radius:10px}
.mdl{border-radius:16px}
.field input,.field textarea{border-radius:10px}
.sel-p img{border-radius:8px}
.wa .tip{border-radius:8px}
</style>
</head>

/* ================= TRACKING (bookings) ================= */
function utm(){
  var o={}; try{ var sp=new URLSearchParams(location.search); ['utm_source','utm_medium','utm_campaign'].forEach(function(k){ if(sp.get(k)) o[k]=sp.get(k); }); }catch(e){}
  return Object.keys(o).map(function(k){return k+'='+o[k];}).join('&');
}
function saveRecord(rec){
  var arr=[]; try{ arr=JSON.parse(safeGet('weavara_bookings')||'[]'); }catch(e){}
  arr.push(rec); safeSet('weavara_bookings',JSON.stringify(arr.slice(-500)));
  if(CFG.API){
    try{ fetch(CFG.API,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}); }catch(e){}
  }
}
function baseRecord(type){
  var entry=''; try{entry=sessionStorage.getItem('wv_entry')||'';}catch(e){}
  return {id:'WV'+Date.now().toString(36).toUpperCase(),ts:new Date().toISOString(),type:type,name:'',phone:'',address:'',pincode:'',note:'',productId:'',productName:'',price:'',collection:'',bookedFromUrl:pageUrl(),entryUrl:entry,referrer:document.referrer||'',utm:utm(),lang:state.lang,whatsapp:'redirected',status:'New'};
}
function trackVisit(){
  var vid,sid,entry='';
  try{ vid=localStorage.getItem('wv_vid'); if(!vid){ vid='V'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('wv_vid',vid); } }catch(e){ vid='anon'; }
  try{ sid=sessionStorage.getItem('wv_sid'); if(!sid){ sid='S'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); sessionStorage.setItem('wv_sid',sid); } entry=sessionStorage.getItem('wv_entry')||''; }catch(e){ sid='anon'; }
  var rec={id:'PV'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:new Date().toISOString(),type:'page_view',
    page:location.href,route:state.base||'home',title:document.title,lang:state.lang,referrer:document.referrer||'',utm:utm(),entryUrl:entry,vid:vid,sid:sid,
    device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'mobile':'desktop'};
  var arr=[]; try{ arr=JSON.parse(safeGet('weavara_visits')||'[]'); }catch(e){}
  arr.push(rec); safeSet('weavara_visits',JSON.stringify(arr.slice(-1000)));
  if(CFG.API){ try{ fetch(CFG.API,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}); }catch(e){} }
}
function submitBooking(form){
  var d={name:form.name.value.trim(),phone:form.phone.value.replace(/[\s\-]/g,'').replace(/^(\+?91|0)/,''),addr:form.addr.value.trim(),pin:form.pin.value.trim(),note:form.note.value.trim()};
  var ok=true;
  function chk(id,cond,msg){var w=form.querySelector('[data-f="'+id+'"]'), e=$('e_'+id); if(!cond){ok=false;w.classList.add('bad');e.textContent=t(msg);}else{w.classList.remove('bad');e.textContent='';}}
  chk('name',d.name.length>=2,'e_name'); chk('phone',/^[6-9]\d{9}$/.test(d.phone),'e_phone'); chk('addr',d.addr.length>=8,'e_addr'); chk('pin',/^\d{6}$/.test(d.pin),'e_pin');
  if(!ok){ var b=form.querySelector('.bad input,.bad textarea'); if(b) b.focus(); return; }
  var kind=form.getAttribute('data-kind'), p=kind==='order'?byId(form.getAttribute('data-id')):null;
  var rec=baseRecord(kind);
  rec.name=d.name; rec.phone='+91'+d.phone; rec.address=d.addr; rec.pincode=d.pin; rec.note=d.note;
  var lines=[];
  lines.push('*'+t(kind==='order'?'m_order':'m_book')+' - Weavara*');
  if(p){ rec.productId=p.id; rec.productName=p.en; rec.price=p.price; rec.collection=p.coll; lines.push(t('m_saree')+': '+nm(p)+' ('+p.id+')'); lines.push(t('m_coll')+': '+cn(p.coll)); lines.push(t('m_price')+': '+priceStr(p)); }
  lines.push(t('m_name')+': '+d.name); lines.push(t('m_phone')+': +91 '+d.phone); lines.push(t('m_addr')+': '+d.addr); lines.push(t('m_pin')+': '+d.pin);
  if(d.note) lines.push(t('m_note')+': '+d.note);
  lines.push(t('wa_pg')+': '+rec.bookedFromUrl);
  saveRecord(rec);
  var url=waLink(lines.join('\n'));
  var w=null; try{ w=window.open(url,'_blank'); }catch(e){}
  $('modal').innerHTML=successHtml(url);
  if(!w){ location.href=url; }
}

function parseHash(){
  var h=location.hash.replace(/^#\/?/,'').split('?')[0];
  var parts=h.split('/').filter(function(x){return x!=='';}).map(function(x){try{return decodeURIComponent(x);}catch(e){return x;}});
  var lang=null;
  if(parts[0]==='en'||parts[0]==='hi'){lang=parts.shift();}
  return {lang:lang,parts:parts};
}
function setTitle(s){document.title=(s?s+' | ':'')+'Weavara'+(s?'':' | The Art of Weaving Stories');}
function route(){
  var r=parseHash();
  state.lang=r.lang||safeGet('wv_lang')||'en';
  safeSet('wv_lang',state.lang);
  document.documentElement.lang=state.lang;
  if(!r.lang){ location.replace('#/'+state.lang+'/'+r.parts.join('/')); return; }
  var a=r.parts[0]||'', b=r.parts[1];
  var modal=(a==='book'||a==='order');
  var path=modal?state.base:r.parts.join('/');
  var parts=modal?(state.base?state.base.split('/'):[]):r.parts;
  if(!modal){ state.base=path; state.baseUrl=location.href; }
  else if(!state.baseUrl){ state.baseUrl=location.href.replace(/#.*$/,'')+'#/'+state.lang+'/'; }
  var pa=parts[0]||'', pb=parts[1], html='', cur=pa, ttl='', q='';
  if(pa===''){ html=pageHome(); cur=''; }
  else if(pa==='collection'){ html=pageCollection(pb); ttl=collOf(pb)?cn(pb):t('nf_t'); cur='collection/'+pb; }
  else if(pa==='product'){ var p=byId(pb); html=pageProduct(pb); ttl=p?nm(p):t('nf_t'); cur='collection/'+(p?p.coll:''); }
  else if(pa==='search'){ q=pb||''; html=pageSearch(q); ttl=t('res_t'); cur='-'; }
  else if(pa==='about'){ html=pageAbout(); ttl=t('about_t'); cur='about'; }
  else if(pa==='faq'){ html=pageFaq(); ttl=t('faqs'); cur='faq'; }
  else if(pa==='contact'){ html=pageContact(); ttl=t('contact'); cur='contact'; }
  else { html=pageNF(); ttl=t('nf_t'); }
  var same=(state.last===state.lang+'|'+path);
  if(!((modal||state.wasModal)&&same)){
    renderHeader(cur,q); $('view').innerHTML=html; renderFooter(); setTitle(ttl);
    window.scrollTo(0,0); initHero(); trackVisit();
  }
  state.last=state.lang+'|'+path; state.wasModal=modal;
  var wa=$('wa'); wa.href=waLink(t('wa_hi')+'\n'+t('wa_pg')+': '+pageUrl()); $('watip').textContent=t('wa_tip');
  if(modal){
    var prod=(a==='order')?byId(b):null;
    $('modal').innerHTML=modalHtml(prod?'order':'book',prod); document.body.classList.add('lock');
    var fi=$('f_name'); if(fi) fi.focus();
  } else { $('modal').innerHTML=''; document.body.classList.remove('lock'); }
}
function go(path){ location.hash='#/'+state.lang+'/'+path; }

/* ================= HERO ================= */
function initHero(){
  if(state.timer){clearInterval(state.timer);state.timer=null;}
  var hero=document.querySelector('.hero'); if(!hero) return;
  var slides=hero.querySelectorAll('.slide'), dots=hero.querySelectorAll('.dot'), cur=0;
  function show(n){ cur=(n+slides.length)%slides.length; slides.forEach(function(s,i){s.classList.toggle('on',i===cur);}); dots.forEach(function(d,i){d.classList.toggle('on',i===cur);}); }
  hero._show=show; hero._cur=function(){return cur;};
  function start(){ if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; state.timer=setInterval(function(){show(cur+1);},7000); }
  hero.addEventListener('mouseenter',function(){clearInterval(state.timer);});
  hero.addEventListener('mouseleave',function(){clearInterval(state.timer);start();});
  start();
}

/* ================= EVENTS ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='lang'){ e.preventDefault(); var l=el.getAttribute('data-l'); var cur=parseHash().parts.join('/'); location.hash='#/'+l+'/'+cur; return; }
  if(act==='burger'){ var d=$('drawer'); var o=d.classList.toggle('open'); el.setAttribute('aria-expanded',o); return; }
  if(act==='prev'||act==='next'||act==='dot'){ var h=document.querySelector('.hero'); if(h&&h._show){ var c=h._cur(); h._show(act==='dot'?+el.getAttribute('data-i'):(act==='next'?c+1:c-1)); } return; }
  if(act==='close'||(act==='ovl'&&e.target===el)){ e.preventDefault(); go(state.base||''); return; }
  if(act==='wa'){
    var rec=baseRecord('whatsapp_click'); saveRecord(rec); return;
  }
  /* 'order' and 'book' are normal links, the router opens the modal */
});
document.addEventListener('submit',function(e){
  var f=e.target, kind=f.getAttribute('data-form'); if(!kind) return;
  e.preventDefault();
  if(kind==='search'){ var q=f.q.value.trim(); if(q) go('search/'+encodeURIComponent(q)); return; }
  if(kind==='book'){ submitBooking(f); }
});
document.addEventListener('change',function(e){ var el=e.target; if(el.getAttribute&&el.getAttribute('data-act')==='sort'){ state.sort=el.value; state.last=''; route(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('modal').innerHTML){ go(state.base||''); } });
window.addEventListener('hashchange',route);

try{ if(!sessionStorage.getItem('wv_entry')) sessionStorage.setItem('wv_entry',location.href); }catch(e){}
route();
})();
</script>
</body>
